<style>
:root{--accent:#4776E6;--violet:#8E54E9;--orange:#FF9F0A;--green:#32D74B;--red:#FF453A;--bg:#1A1D2B;--glass:rgba(255,255,255,.08);--line:rgba(255,255,255,.14);--text:#fff;--dim:#B4B8C6;--sheet:#252A3C;--bar:rgba(37,42,60,.9);
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#F4F5F9;--glass:rgba(255,255,255,.85);--line:rgba(0,0,0,.08);--text:#14151A;--dim:#6B6F7B;--sheet:#fff;--bar:rgba(255,255,255,.92);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif}
html{background:var(--bg)}
body{background:transparent;color:var(--text);min-height:100vh;padding-bottom:130px;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 0 0,rgba(71,118,230,.28),transparent 45%),radial-gradient(circle at 100% 100%,rgba(142,84,233,.26),transparent 45%)}

button{font:inherit;color:inherit;cursor:pointer}
header{padding:22px 20px 6px;display:flex;justify-content:space-between;align-items:center;max-width:1100px;margin:0 auto}

.av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--violet));color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;background-size:cover;background-position:center}
.quit{background:var(--glass);border:1px solid var(--line);padding:8px 14px;border-radius:14px;color:var(--red);font-size:11px;font-weight:800}
.demo{max-width:1100px;margin:8px auto 0;padding:0 20px}
.demo span{display:block;background:rgba(255,159,10,.14);border:1px solid rgba(255,159,10,.35);color:var(--orange);font-size:12px;font-weight:600;padding:9px 14px;border-radius:14px}
main{max-width:1100px;margin:0 auto;padding:0 20px}
.nav{display:flex;align-items:center;justify-content:space-between;margin:14px 0 20px}
.nav h1{font-size:30px;font-weight:800;letter-spacing:-1.2px}
.nav div{display:flex;gap:8px}
.nav button{background:var(--glass);border:1px solid var(--line);width:42px;height:42px;border-radius:14px;font-size:16px}
.grid{display:grid;gap:16px}
@media(min-width:900px){.grid{grid-template-columns:1fr 1fr;align-items:start}.nav h1{font-size:38px}}
.hero{border-radius:32px;padding:28px 24px;background:linear-gradient(135deg,var(--accent),var(--violet));color:#fff;box-shadow:0 20px 50px rgba(71,118,230,.28);position:relative;overflow:hidden;cursor:pointer}

.lab{font-size:13px;font-weight:700;opacity:.85}
.big{font-size:46px;font-weight:900;letter-spacing:-2px;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.sub{font-size:14px;font-weight:600;opacity:.95}
.sub b{font-size:17px}
.meter{height:8px;border-radius:8px;background:rgba(255,255,255,.25);margin-top:18px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:8px;background:#fff;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{border-radius:26px;padding:20px;color:#fff;position:relative;overflow:hidden}
.t-or{background:linear-gradient(135deg,#FF9F0A,#FF375F);cursor:pointer}
.t-gr{background:linear-gradient(135deg,#1FB84A,#12945F)}
.tile .v{font-size:24px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.tile .meter{margin-top:12px;height:6px}
.tile svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:46px;opacity:.9}
.card{background:var(--glass);border:1px solid var(--line);border-radius:26px;padding:20px;margin-bottom:16px}
.ct{display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:800;margin-bottom:8px}
.ct small{font-size:14px;color:var(--accent);font-weight:800}
.row{display:flex;align-items:center;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.ed{border:0;background:transparent;color:var(--text);font-size:16px;font-weight:600;width:100%;outline:0;padding:6px;border-radius:8px;min-width:0}
.ed:focus{background:var(--glass);box-shadow:0 0 0 1.5px var(--accent)}
.amt{width:104px;flex:none;text-align:right;font-weight:800;color:var(--accent)}
.amt.neg{color:var(--red)}
.rec,.del{border:0;background:none;font-size:17px;width:30px;height:30px;flex:none;border-radius:10px;opacity:.3}
.rec.on{opacity:1;color:var(--accent);background:rgba(71,118,230,.15)}
.del{color:var(--red)}
.ico{font-size:20px;width:30px;text-align:center;flex:none}
.add{width:100%;padding:13px;margin-top:10px;border-radius:16px;background:transparent;border:1px dashed var(--line);font-weight:700;color:var(--dim)}
.empty{color:var(--dim);font-size:14px;padding:10px 0;text-align:center}
.tiles4{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.st{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:16px}
.st b{display:block;font-size:24px;font-weight:800;letter-spacing:-.5px;margin-top:2px}
.st span{font-size:12.5px;color:var(--dim);font-weight:600}
.up{color:var(--red)}.down{color:var(--green)}
.donut{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut svg{width:150px;height:150px;flex:none}
.donut ul{list-style:none;flex:1;min-width:140px;display:grid;gap:8px;font-size:14px;font-weight:600}
.donut li{display:flex;align-items:center;gap:8px}.donut li i{width:10px;height:10px;border-radius:4px}.donut li em{margin-left:auto;font-style:normal;color:var(--dim);font-variant-numeric:tabular-nums}
.dt{font-size:24px;font-weight:800;fill:var(--text)}.dl{font-size:9px;fill:var(--dim)}
.chart svg{width:100%;height:auto;display:block}.chart text{font-size:10px;fill:var(--dim)}
.leg{display:flex;gap:14px;font-size:12px;color:var(--dim);margin-top:8px;font-weight:600}.leg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.hb{margin:10px 0}.hb div{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:5px}
.hb i{display:block;height:8px;border-radius:8px;background:linear-gradient(90deg,var(--red),var(--orange))}
.modal{display:none;position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.6);backdrop-filter:blur(14px);align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.sheet{background:var(--sheet);width:100%;max-width:520px;border-radius:34px 34px 0 0;padding:14px 22px calc(24px + env(safe-area-inset-bottom,0px));max-height:88dvh;overflow:hidden;display:flex;flex-direction:column;position:relative;border-top:1px solid var(--line);animation:up .38s cubic-bezier(.16,1,.3,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 26px}
.sheet h2{font-size:23px;letter-spacing:-.5px}
.quick{display:flex;gap:8px;margin:14px 0 10px}
.quick input{border:1px solid var(--line);background:var(--glass);color:var(--text);border-radius:14px;padding:14px;font-size:16px;outline:0;min-width:0}
.quick input:focus{border-color:var(--accent)}
.quick #qc{flex:1}.quick #qa{width:96px;text-align:right}
.quick button{border:0;border-radius:14px;width:52px;font-size:22px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--violet))}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.chips button{flex:none;background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:7px 13px;font-size:13px;font-weight:600}
.spacer{height:0;transition:height .25s}
.tabs-wrap{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:center;z-index:1000;pointer-events:none}
.tabs{pointer-events:auto;background:var(--bar);border:1px solid var(--line);backdrop-filter:blur(24px);border-radius:28px;display:flex;padding:8px;gap:2px;box-shadow:0 18px 50px rgba(0,0,0,.35);width:90%;max-width:420px}
.tab{flex:1;border:0;background:none;color:var(--dim);font-size:11px;font-weight:700;padding:8px 0;border-radius:20px;transition:.25s}
.tab .i{font-size:22px;display:block}
.tab.on{color:var(--text);background:var(--glass)}
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--sheet);border:1px solid var(--line);padding:11px 16px;border-radius:16px;font-size:14px;font-weight:600;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:.3s;z-index:3000;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:none;color:var(--accent);font-weight:800}
.save{width:8px;height:8px;border-radius:50%;background:var(--green);transition:.3s}.save.busy{background:var(--orange)}
.hero,.tile{isolation:isolate}
.hero{background:linear-gradient(120deg,#4776E6,#8E54E9,#E054C8,#4776E6);background-size:300% 300%;animation:flow 12s ease-in-out infinite}
.t-or{background:linear-gradient(120deg,#FF9F0A,#FF375F,#FF6B3D,#FF9F0A);background-size:300% 300%;animation:flow 9s ease-in-out infinite}
.t-gr{background:linear-gradient(120deg,#1FB84A,#12945F,#0FA5A0,#1FB84A);background-size:300% 300%;animation:flow 11s ease-in-out infinite}
@keyframes flow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.hero::after{z-index:-1;animation:drift 9s ease-in-out infinite alternate}
.tile::before{content:"";position:absolute;z-index:-1;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.18);right:-40px;top:-60px;filter:blur(6px);animation:drift 7s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(-60px,45px) scale(1.3)}}
.view[hidden]{display:none}
.hero.warn{background:linear-gradient(120deg,#FF9F0A,#FF6B3D,#E8590C,#FF9F0A);background-size:300% 300%}
.hero.bad{background:linear-gradient(120deg,#FF453A,#C2185B,#FF375F,#FF453A);background-size:300% 300%}
.hero,.tile{transition:transform .2s}.hero:active,.tile:active{transform:scale(.98)}
.grab{position:relative}.grab::before{content:"";position:absolute;inset:-14px -70px -10px}
.row{transition:transform .25s,opacity .25s}
.donut li.gh{font-weight:800;margin-top:8px}.donut li.it{padding-left:16px;font-weight:500;font-size:13px}.donut li.gh i{width:10px;height:10px;border-radius:4px}
.grid>div{min-width:0}
.donut{flex-direction:column;flex-wrap:nowrap;align-items:center;gap:16px}
.donut ul{width:100%;min-width:0;flex:none}
.donut li{min-width:0;align-items:flex-start;overflow-wrap:anywhere}
.donut li em{white-space:nowrap;padding-left:10px;flex:none}
.donut li i{flex:none;margin-top:5px}
@media(min-width:620px){.donut{flex-direction:row;align-items:flex-start}.donut svg{position:sticky;top:16px}}
.sheet>*{flex:none}
.sheet>[id^=l-]{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:8px}
.xbtn{position:absolute;top:8px;right:14px;width:34px;height:34px;border-radius:50%;border:0;background:var(--glass);color:var(--dim);font-size:14px;z-index:3}
.sheet>.ct{cursor:grab}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---------- Icônes en trait ---------- */
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em;flex:none}
.tab .i{display:grid;place-items:center;margin-bottom:3px}
.tab .i .ic{width:25px;height:25px}
.ico{display:grid;place-items:center;color:var(--dim)}
.ico .ic{width:20px;height:20px}
.ct .ic,.lab .ic{margin-left:2px;opacity:.9}
#th .ic{width:18px;height:18px;vertical-align:middle;color:var(--text)}
.chips .ic{width:15px;height:15px;margin-right:4px;vertical-align:-.2em}
.hb .ic{width:16px;height:16px;margin-right:4px;vertical-align:-.25em;color:var(--dim)}
.tile .lab .ic{position:static;left:auto;right:auto;bottom:auto;width:15px;height:15px;opacity:.9;vertical-align:-.2em}
/* ---------- Ajout automatique : bouton + vert quand la ligne est prête ---------- */
.quick button{transition:background .25s,transform .25s}
.quick.ready button{background:var(--green);transform:scale(1.06)}
/* ---------- NOUVEAU : reflet qui passe sur « Disponible global » ---------- */
.hero::before{content:"";position:absolute;top:0;bottom:0;left:0;width:35%;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:translateX(-150%) skewX(-20deg);animation:shine 5s ease-in-out infinite}
@keyframes shine{0%{transform:translateX(-150%) skewX(-20deg)}45%,100%{transform:translateX(400%) skewX(-20deg)}}
/* ---------- NOUVEAU : variation du mois sur la tuile Épargne ---------- */
.delta{display:inline-block;margin-top:6px;font-size:12px;font-weight:800;background:rgba(255,255,255,.22);padding:3px 10px;border-radius:20px;font-variant-numeric:tabular-nums;position:relative;z-index:1}
.delta:empty{display:none}
/* ---------- NOUVEAU : tuile Courses en dépassement ---------- */
.t-or.over{background:linear-gradient(120deg,#FF453A,#C2185B,#FF375F,#FF453A);background-size:300% 300%}
</style>
</head>
<body>
<header>
  <div class="pill"><div id="av" class="av">?</div><span id="who">Chargement…</span><span id="sv" class="save" title="Synchronisation"></span></div>

  <div class="nav"><h1 id="ml">…</h1><div><button onclick="chg(-1)" aria-label="Mois précédent">❬</button><button onclick="chg(1)" aria-label="Mois suivant">❭</button></div></div>

  <section class="view" id="v-home"><div class="grid">
    <div>
      <div class="hero" onclick="openM('m-dep')">

        <div class="tile t-gr"><div class="lab">Épargne <span data-ic="trend"></span></div><div class="v" id="sav">0 €</div><div class="delta" id="sdelta"></div><div id="spk"></div></div>
      </div>

<script>

function demoData(){
  const d={};const r=(a,b)=>Math.round(a+Math.random()*(b-a));
  const cats=[['Restaurant',12,45],['Essence',30,70],['Café',3,6],['Cinéma',9,25],['Pharmacie',6,30],['Vêtements',20,80],['Transport',2,30]];
  const shops=['Carrefour','Leclerc','Lidl','Marché'];
  for(let i=5;i>=0;i--){
    let m=M-i,y=Y;while(m<0){m+=12;y--}
    d[key(y,m)]={revenus:[{category:'Salaire',amount:2150,recurring:true},{category:'Freelance',amount:r(0,300),recurring:false}],
      charges:[{category:'Loyer',amount:720,recurring:true},{category:'Électricité',amount:65,recurring:true},{category:'Internet',amount:30,recurring:true},{category:'Abonnements',amount:24,recurring:true}],
      budget_courses:[{category:'Budget Courses',amount:350,recurring:true}],
      tickets_courses:Array.from({length:r(5,9)},()=>({category:shops[r(0,3)],amount:r(18,70),recurring:false})),
      depenses:Array.from({length:r(8,15)},()=>{const c=cats[r(0,cats.length-1)];return{category:c[0],amount:r(c[1],c[2]),recurring:false}}),

/* ---------- Données (logique identique à la V1) ---------- */
function initMonth(y,m){
  const k=key(y,m);if(data[k])return;
  let pm=m-1,py=y;if(pm<0){pm=11;py--}
  const pk=key(py,pm);
  const n={revenus:[],charges:[],depenses:[],tickets_courses:[],budget_courses:[{category:"Budget Courses",amount:0,recurring:true}],epargne:[{category:"À épargner",amount:0},{category:"Retiré",amount:0}]};
  if(data[pk])['revenus','charges','budget_courses'].forEach(t=>{n[t]=(data[pk][t]||[]).filter(i=>i.recurring).map(i=>({...i}))});
  data[k]=n;
}
function propagate(type,item){
  let m=M,y=Y;
  for(let i=0;i<12;i++){m++;if(m>11){m=0;y++}
    const k=key(y,m);if(!data[k])initMonth(y,m);
    if(type==='budget_courses'){if(data[k][type]?.[0])data[k][type][0].amount=item.amount}
    else{const e=data[k][type].findIndex(x=>x.category===item.category);if(e>-1)data[k][type][e]={...item};else data[k][type].push({...item})}
  }
}
function unpropagate(type,cat){
  let m=M,y=Y;
  for(let i=0;i<12;i++){m++;if(m>11){m=0;y++}
    const k=key(y,m);if(data[k]?.[type])data[k][type]=data[k][type].filter(x=>x.category!==cat);
  }
}
function upd(type,i,f,v){
  const it=cur()?.[type]?.[i];if(!it)return;
  it[f]=f==='amount'?parseFloat(v)||0:v;
  if(type==='budget_courses'||it.recurring)propagate(type,it);
  save();
}
function togRec(type,i){const it=cur()[type][i];it.recurring=!it.recurring;it.recurring?propagate(type,it):unpropagate(type,it.category);buzz();save()}
function add(type){cur()[type].push({category:"Nouveau",amount:0,recurring:false});save()}
/* Ajout d’une ligne (dépenses / tickets) : montant obligatoire, nom facultatif.
   Appelée par le bouton +, la touche Entrée, et automatiquement (voir bloc « Ajout automatique »). */
function quick(type,refocus=true){
  const c=$('qc-'+type),a=$('qa-'+type);
  const amount=parseFloat(a.value);
  if(!amount){if(refocus)a.focus();return false}
  const name=c.value.trim()||(type==='tickets_courses'?'Courses':'Divers');
  const it={category:name,amount,recurring:false},k=key();
  cur()[type].push(it);
  c.value='';a.value='';c.closest('.quick').classList.remove('ready');
  buzz();save();
  toast(`Ajouté : ${name} ${fmt(amount)}`,()=>{const L=data[k][type],j=L.indexOf(it);if(j>-1){L.splice(j,1);save()}});
  if(refocus)c.focus();
  return true;
}
function flushQuick(){['depenses','tickets_courses'].forEach(t=>quick(t,false))}
function del(type,i){
  const it=cur()[type][i];
  if(it.recurring)unpropagate(type,it.category);
  cur()[type].splice(i,1);undo={type,i,it,k:key()};save();
  toast('Supprimé',()=>{data[undo.k][undo.type].splice(undo.i,0,undo.it);if(undo.it.recurring)propagate(undo.type,undo.it);undo=null;save()});
}
function chg(d){M+=d;if(M<0){M=11;Y--}if(M>11){M=0;Y++}initMonth(Y,M);render()}
function save(){
  render();
  if(demo||!user)return;
  $('sv').classList.add('busy');clearTimeout(saveT);
  saveT=setTimeout(()=>db.collection("users").doc(user.uid).set(data).then(()=>$('sv').classList.remove('busy')).catch(()=>toast('Erreur de sauvegarde')),500);
}
addEventListener('pagehide',()=>{if(!demo&&user&&saveT){clearTimeout(saveT);db.collection("users").doc(user.uid).set(data)}});

/* ---------- Calculs ---------- */
function sm(k){
  const d=data[k]||{};const s=t=>(d[t]||[]).reduce((a,i)=>a+(parseFloat(i.amount)||0),0);
  const e=d.epargne||[];const ep=(parseFloat(e[0]?.amount)||0)-(parseFloat(e[1]?.amount)||0);
  const r={rev:s('revenus'),ch:s('charges'),dep:s('depenses'),bc:s('budget_courses'),tk:s('tickets_courses'),ep};
  r.out=r.ch+r.ep+r.dep+r.bc;r.net=r.rev-r.out;return r;
}
function cum(y,m){
  const lim=y*12+m;let t=0;
  Object.keys(data).forEach(k=>{const p=k.split('_');const idx=parseInt(p[0])*12+MONTHS.indexOf(p[1]);if(p[1]&&MONTHS.includes(p[1])&&idx<=lim)t+=sm(k).ep});
  return t;
}
function series(n=6){const o=[];for(let i=n-1;i>=0;i--){let m=M-i,y=Y;while(m<0){m+=12;y--}o.push({y,m,s:sm(key(y,m)),c:cum(y,m)})}return o}
function topCats(type,n=7){
  const c={};Object.values(data).forEach(d=>(d[type]||[]).forEach(i=>{const k=(i.category||'').trim();if(k&&k!=='Nouveau')c[k]=(c[k]||0)+1}));
  return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,n).map(x=>x[0]);
}
const ICONS=[[/resto|restau|burger|pizza|kebab|sushi/i,'utensils'],[/caf[eé]|bar|biere|bière/i,'coffee'],[/essence|carbu|gazole|parking|peage|péage/i,'fuel'],[/transport|train|bus|metro|métro|uber|taxi/i,'train'],[/cin[eé]|film|netflix|jeu|sortie/i,'film'],[/pharma|sant[eé]|m[eé]decin|dentiste/i,'pill'],[/v[eê]tement|zara|shoes|chaussure/i,'shirt'],[/coiff|beaut[eé]/i,'scissors'],[/cadeau/i,'gift'],[/amazon|achat|shop/i,'box'],[/courses|carrefour|leclerc|lidl|auchan/i,'cart']];
const icon=c=>ic((ICONS.find(x=>x[0].test(c))||[0,'card'])[1]);

/* ---------- Rendu ---------- */
function num(el,v,f=fmt){const a=el._v||0;el._v=v;const t0=performance.now();const st=t=>{const p=Math.min(1,(t-t0)/450);el.textContent=f(a+(v-a)*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(st)};requestAnimationFrame(st)}
function rows(type,rev){
  const L=cur()[type]||[];
  const idx=L.map((_,i)=>i);if(rev)idx.reverse();
  return idx.map(i=>{const it=L[i];
    const locked=(type==='budget_courses'&&i===0)||type==='epargne';
    const neg=type==='depenses'||type==='tickets_courses'||(type==='epargne'&&i===1);
    const canDel=type!=='epargne'&&!(type==='budget_courses'&&i===0);
    return `<div class="row">${(type==='revenus'||type==='charges')?`<button class="rec ${it.recurring?'on':''}" onclick="togRec('${type}',${i})" aria-label="Récurrent">↻</button>`:''}${type==='depenses'?`<span class="ico">${icon(it.category)}</span>`:''}<input class="ed" value="${esc(it.category)}" ${locked?'readonly':''} onchange="upd('${type}',${i},'category',this.value)"><input class="ed amt ${neg?'neg':''}" type="number" step="0.01" inputmode="decimal" value="${it.amount}" onfocus="this.select()" onchange="upd('${type}',${i},'amount',this.value)">${canDel?`<button class="del" onclick="del('${type}',${i})" aria-label="Supprimer">✕</button>`:'<span style="width:30px;flex:none"></span>'}</div>`}).join('')||'<p class="empty">Rien pour l’instant</p>';
}
function render(){
  $('ml').textContent=`${MONTHS[M]} ${Y}`;
  const d=cur();if(!d)return;
  const s=sm(key());
  TYPES.forEach(t=>{
    const el=$('l-'+t);if(!el)return;
    if(el.contains(document.activeElement)&&document.activeElement.tagName==='INPUT'&&false)return;
    el.innerHTML=rows(t,t==='depenses'||t==='tickets_courses');
  });
  const sub={revenus:s.rev,charges:s.ch,budget_courses:s.bc,epargne:s.ep};
  Object.keys(sub).forEach(t=>{const e=$('s-'+t);if(e)e.textContent=fmt(sub[t])});
  $('tot-depenses').textContent=fmt(s.dep);$('tot-tickets_courses').textContent=fmt(s.tk);
  num($('restant'),s.net);
  const isNow=Y===now.getFullYear()&&M===now.getMonth();
  const dim=new Date(Y,M+1,0).getDate(),left=dim-now.getDate()+1;
  
  $('useBar').style.width=Math.min(100,s.rev?s.out/s.rev*100:0)+'%';
  const ratio=s.rev?s.out/s.rev:(s.out?1:0);
  const hero=document.querySelector('.hero');hero.classList.toggle('bad',s.net<0);hero.classList.toggle('warn',s.net>=0&&ratio>.9);
  /* Courses : plus de % ni de point d’exclamation */
  const over=s.bc>0&&s.tk>s.bc;
  $('cpct').textContent=s.bc?(over?'Budget dépassé':'sur '+fmt(s.bc)):'';
  document.querySelector('.t-or').classList.toggle('over',over);
  num($('cr'),s.bc-s.tk);
  $('cBar').style.width=Math.min(100,s.bc?s.tk/s.bc*100:0)+'%';
  num($('sav'),Math.round(cum(Y,M)),v=>Math.round(v).toLocaleString('fr-FR')+' €');
  /* Épargne : variation du mois */
  const dl=Math.round(s.ep);
  $('sdelta').textContent=dl?`${dl>0?'+':'−'} ${Math.abs(dl).toLocaleString('fr-FR')} € ce mois`:'';
  $('spk').innerHTML=spark(series().map(x=>x.c),300,46);
  drawChips();
  if(view==='stats')renderStats();
}
function drawChips(){
  ['depenses','tickets_courses'].forEach(t=>{
    $('chips-'+t).innerHTML=topCats(t).map(c=>`<button onclick="pick('${t}','${esc(c).replace(/'/g,"\\'")}')">${t==='depenses'?icon(c)+' ':''}${esc(c)}</button>`).join('');
  });
}
/* Suggestion : si un montant est déjà saisi, la ligne est ajoutée tout de suite */
function pick(t,c){
  const n=$('qc-'+t),a=$('qa-'+t);
  if(parseFloat(a.value)){
    if(!n.value.trim()){n.value=c;quick(t,false);a.blur();return}
    quick(t,false);
  }
  n.value=c;a.focus();
}

/* ---------- Graphiques SVG ---------- */
function spark(v,w,h){
  const mn=Math.min(...v,0),mx=Math.max(...v,1);
  const p=v.map((y,i)=>[i/(v.length-1||1)*w,h-4-(y-mn)/(mx-mn||1)*(h-12)]);
  const d=p.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join('');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${d}L${w} ${h}L0 ${h}Z" fill="rgba(255,255,255,.18)"/><path d="${d}" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
}
function grpList(list){const g={};(list||[]).forEach(i=>{const c=(i.category||'Divers').trim();g[c]=(g[c]||0)+(parseFloat(i.amount)||0)});return Object.entries(g).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1])}
function hbars(l){const mx=l[0]?.[1]||1;return l.length?l.map(t=>`<div class="hb"><div><span>${icon(t[0])} ${esc(t[0])}</span><span>${fmt(t[1])}</span></div><i style="width:${t[1]/mx*100}%"></i></div>`).join(''):'<p class="empty">Rien ce mois-ci.</p>'}
function donut(s){
  const d=data[key()]||{};
  const G=[['Charges fixes',268,grpList(d.charges)],['Courses',36,s.bc>0?[['Budget courses',s.bc]]:[]],['Dépenses',6,grpList(d.depenses)],['Épargne',135,s.ep>0?[['Mis de côté',s.ep]]:[]],['Reste',220,s.net>0?[['Disponible',s.net]]:[]]].filter(g=>g[2].length);
  const tot=G.reduce((a,g)=>a+g[2].reduce((b,x)=>b+x[1],0),0);
  if(!tot)return '<p class="empty">Ajoute des revenus et des dépenses pour voir la répartition.</p>';
  const C=2*Math.PI*54;let off=0,arcs='',leg='';
  G.forEach(g=>{
    const sum=g[2].reduce((b,x)=>b+x[1],0),single=g[2].length===1&&g[0]!=='Dépenses'&&g[0]!=='Charges fixes';
    const col=i=>`hsl(${g[1]} 75% ${Math.max(32,66-i*7)}%)`;
    leg+=`<li class="gh">${single?`<i style="background:${col(0)}"></i>`:''}${g[0]}<em>${fmt(sum)}</em></li>`;
    g[2].forEach((x,i)=>{const l=x[1]/tot*C;arcs+=`<circle r="54" cx="70" cy="70" fill="none" stroke="${col(i)}" stroke-width="16" stroke-dasharray="${Math.max(l-1.5,.5)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=l;if(!single)leg+=`<li class="it"><i style="background:${col(i)}"></i>${esc(x[0])}<em>${fmt(x[1])}</em></li>`});
  });
  return `<div class="donut"><svg viewBox="0 0 140 140" role="img" aria-label="Répartition du mois">${arcs}<text x="70" y="70" text-anchor="middle" class="dt">${Math.round(s.rev?s.out/s.rev*100:0)}%</text><text x="70" y="86" text-anchor="middle" class="dl">des revenus utilisés</text></svg><ul>${leg}</ul></div>`;
}
function bars(sr){
  const mx=Math.max(1,...sr.flatMap(x=>[x.s.rev,x.s.out]));const h=100;
  return `<div class="chart"><svg viewBox="0 0 300 120" role="img" aria-label="Revenus et sorties sur 6 mois">${sr.map((x,i)=>{const bx=i*50+8,a=x.s.rev/mx*h,b=x.s.out/mx*h;return `<rect x="${bx}" y="${h-a}" width="16" height="${a}" rx="4" fill="#4776E6"/><rect x="${bx+19}" y="${h-b}" width="16" height="${b}" rx="4" fill="#FF9F0A"/><text x="${bx+17}" y="116" text-anchor="middle">${MONTHS[x.m].slice(0,4)}</text>`}).join('')}</svg><div class="leg"><span><i style="background:#4776E6"></i>Revenus</span><span><i style="background:#FF9F0A"></i>Sorties</span></div></div>`;
}
function renderStats(){
  const k=key(),s=sm(k),sr=series();
  let pm=M-1,py=Y;if(pm<0){pm=11;py--}
  const p=sm(key(py,pm));
  const dv=p.dep?Math.round((s.dep-p.dep)/p.dep*100):null;
  const taux=s.rev?Math.round(s.ep/s.rev*100):0;
  const fixe=s.rev?Math.round(s.ch/s.rev*100):0;
  const tks=data[k].tickets_courses||[];
  $('v-stats').innerHTML=`<div class="grid"><div>
  <div class="tiles4">
    <div class="st"><span>Taux d’épargne</span><b>${taux}%</b></div>
    <div class="st"><span>Charges fixes</span><b>${fixe}%</b></div>
    <div class="st"><span>Dépenses vs mois dernier</span><b class="${dv==null?'':dv>0?'up':'down'}">${dv==null?'–':(dv>0?'+':'')+dv+'%'}</b></div>
    <div class="st"><span>Ticket moyen</span><b>${tks.length?fmt(s.tk/tks.length):'–'}</b></div>
  </div>
  <div class="card"><div class="ct">Répartition du mois</div>${donut(s)}</div></div><div>
  <div class="card"><div class="ct">6 derniers mois</div>${bars(sr)}</div>
  <div class="card"><div class="ct">Charges fixes <small>${fmt(s.ch)}</small></div>${hbars(grpList(data[k].charges))}</div>
  <div class="card"><div class="ct">Dépenses par catégorie <small>${fmt(s.dep)}</small></div>${hbars(grpList(data[k].depenses))}</div>
  </div></div>`;
}

function fitKb(){

  m.style.top=vv.offsetTop+'px';m.style.height=vv.height+'px';m.style.bottom='auto';

  const a=document.activeElement;if(a&&sh.contains(a)&&a.tagName==='INPUT')a.scrollIntoView({block:'nearest'});
}
if(vv){vv.addEventListener('resize',fitKb);vv.addEventListener('scroll',fitKb)}
document.addEventListener('focusin',e=>{const sh=e.target.closest?.('.sheet');if(!sh||e.target.tagName!=='INPUT')return;
  if(!vv){const sp=sh.querySelector('.spacer');if(sp)sp.style.height='40vh'}
  setTimeout(()=>{fitKb();e.target.scrollIntoView({block:'nearest'})},350)});
document.addEventListener('focusout',e=>{const sp=e.target.closest?.('.sheet')?.querySelector('.spacer');if(sp)sp.style.height='0'});
document.querySelectorAll('.quick input').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter'){const t=i.id.split('-').slice(1).join('-');if(i.id.startsWith('qc'))$('qa-'+t).focus();else quick(t)}}));
/* ---------- Ajout automatique des lignes (dépenses / tickets) ---------- */
document.querySelectorAll('.quick').forEach(q=>{
  const t=q.querySelector('input').id.split('-').slice(1).join('-');
  /* le focus quitte la ligne de saisie (✓ du clavier iPhone, autre champ…) */
  q.addEventListener('focusout',()=>setTimeout(()=>{if(!q.contains(document.activeElement))quick(t,false)},0));
  /* le bouton + passe au vert quand un montant est saisi */
  q.addEventListener('input',()=>q.classList.toggle('ready',!!parseFloat($('qa-'+t).value)));
  /* le bouton + ne vole pas le focus */
  q.querySelector('button').addEventListener('mousedown',e=>e.preventDefault());
});
/* toucher ailleurs dans la fenêtre : iOS garde parfois le clavier ouvert */
document.addEventListener('pointerdown',e=>{
  const m=document.querySelector('.modal.open');if(!m)return;
  const q=m.querySelector('.quick');
  if(q.contains(e.target)||e.target.closest('.chips,.toast,.xbtn'))return;
  const t=q.querySelector('input').id.split('-').slice(1).join('-');
  if(quick(t,false)){const a=document.activeElement;if(a&&a.blur)a.blur()}
},true);
/* swipe gauche/droite = changer de mois */
let sx=0,sy=0;const mn=$('main');
mn.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
mn.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>80&&Math.abs(dy)<45&&!e.target.closest('input'))chg(dx<0?1:-1)},{passive:true});
/* swipe gauche sur une ligne (fenêtres) = supprimer */
let rw=null,rx=0,ry=0,rd=0;
document.addEventListener('touchstart',e=>{const r=e.target.closest?.('.sheet .row');if(!r||!r.querySelector('.del')){rw=null;return}rw=r;rx=e.touches[0].clientX;ry=e.touches[0].clientY;rd=0},{passive:true});
document.addEventListener('touchmove',e=>{if(!rw)return;const dx=e.touches[0].clientX-rx,dy=e.touches[0].clientY-ry;if(dx<-12&&Math.abs(dx)>Math.abs(dy)){rd=dx;rw.style.transition='none';rw.style.transform=`translateX(${dx}px)`;rw.style.opacity=1+dx/300}},{passive:true});
document.addEventListener('touchend',()=>{if(!rw)return;const r=rw;rw=null;r.style.transition='';if(rd<-110){r.style.transform='translateX(-110%)';r.style.opacity=0;buzz();setTimeout(()=>r.querySelector('.del')?.click(),200)}else{r.style.transform='';r.style.opacity=''}rd=0});
/* tirer la poignée vers le bas = fermer la fenêtre */
document.querySelectorAll('.grab,.sheet>.ct').forEach(g=>{let y0=0,dy=0;const sh=g.closest('.sheet');
 g.addEventListener('touchstart',e=>{y0=e.touches[0].clientY;dy=0;sh.style.animation='none';sh.style.transition='none'},{passive:true});
 g.addEventListener('touchmove',e=>{dy=Math.max(0,e.touches[0].clientY-y0);sh.style.transform=`translateY(${dy}px)`},{passive:true});
 g.addEventListener('touchend',()=>{sh.style.transition='transform .25s';if(dy>110)closeM();sh.style.transform='';dy=0;setTimeout(()=>{sh.style.transition='';sh.style.animation=''},300)})});
function unshift(){try{scrollTo(0,1);scrollTo(0,0)}catch(e){}}
addEventListener('load',()=>{unshift();setTimeout(unshift,150);setTimeout(unshift,600)});
addEventListener('pageshow',unshift);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(unshift,100)});
start();
</script>
</body>
